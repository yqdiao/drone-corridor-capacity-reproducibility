name: Reproduce figures and checks

on:
  push:
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Reproduce numerical outputs and exact checks
        run: make reproduce
      - name: Upload generated figures and summaries
        uses: actions/upload-artifact@v4
        with:
          name: corridor-replication-output
          path: |
            sections/generated/*.pdf
            checks/numerical_results/*.json
            checks/results.json
